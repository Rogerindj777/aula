<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teachable Machine · Visão IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #181b22;
      --border: rgba(255,255,255,0.07);
      --accent: #00e5ff;
      --accent2: #7c3aed;
      --text: #e8eaf0;
      --muted: #6b7280;
      --success: #10b981;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow blobs */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
      top: -150px; right: -150px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 28px 0 20px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--accent);
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .brand span {
      color: var(--text);
      opacity: 0.5;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
      margin-right: 6px;
      transition: background 0.4s, box-shadow 0.4s;
    }

    .status-dot.active {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-label {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Main card */
    .main-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    /* Webcam section */
    .webcam-section {
      background: var(--surface2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 340px;
      position: relative;
      padding: 32px 24px;
    }

    /* Corner decorations */
    .corner { position: absolute; width: 20px; height: 20px; }
    .corner--tl { top: 12px; left: 12px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner--tr { top: 12px; right: 12px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
    .corner--bl { bottom: 12px; left: 12px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner--br { bottom: 12px; right: 12px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

    #webcam-container canvas {
      border-radius: 12px;
      max-width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 0 0 2px rgba(0,229,255,0.15), 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Start button */
    .btn-start {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 24px rgba(0,229,255,0.35);
    }

    .btn-start::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(0,229,255,0.55);
    }

    .btn-start:hover::before { opacity: 1; }
    .btn-start:active { transform: translateY(0); }

    .btn-start .icon {
      display: inline-block;
      width: 18px; height: 18px;
      margin-right: 10px;
      vertical-align: middle;
      margin-top: -2px;
    }

    /* Camera permission hint */
    .cam-hint {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
    }

    .cam-hint strong { color: var(--accent); }

    /* Results section */
    .results-section {
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .results-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }

    #label-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    .prediction-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prediction-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .prediction-class {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 500;
    }

    .prediction-pct {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
      transition: color 0.3s;
      min-width: 48px;
      text-align: right;
    }

    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 100px;
      width: 0%;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      position: relative;
    }

    .progress-fill.high {
      background: linear-gradient(90deg, var(--accent), var(--success));
      box-shadow: 0 0 10px rgba(0,229,255,0.4);
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      padding: 32px 0;
    }

    .empty-icon {
      width: 52px; height: 52px;
      opacity: 0.18;
    }

    .empty-text {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      opacity: 0.7;
    }

    /* Scan line animation when active */
    .scanning::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      top: 0;
      animation: scan 2.5s linear infinite;
      opacity: 0.6;
    }

    @keyframes scan {
      0% { top: 10%; }
      100% { top: 90%; }
    }

    /* Responsive */
    @media (max-width: 767px) {
      .webcam-section {
        border-right: none;
        border-bottom: 1px solid var(--border);
        min-height: 280px;
        padding: 24px 16px;
      }
      .results-section { padding: 24px 20px; }
    }
  </style>
</head>
<body>
<div class="page-wrapper">

  <!-- Header -->
  <header>
    <div class="container">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <span class="brand">VISÃO<span>/</span>IA</span>
        <div class="d-flex align-items-center gap-2">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-label" id="status-label">Aguardando</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="container my-4 my-md-5 flex-grow-1">
    <div class="main-card">
      <div class="row g-0">

        <!-- Left: webcam -->
        <div class="col-12 col-md-6">
          <div class="webcam-section" id="webcam-section">
            <div class="corner corner--tl"></div>
            <div class="corner corner--tr"></div>
            <div class="corner corner--bl"></div>
            <div class="corner corner--br"></div>

            <!-- Start screen -->
            <div id="start-screen" class="d-flex flex-column align-items-center gap-3">
              <svg class="mb-2" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="opacity:0.6">
                <rect x="6" y="14" width="52" height="36" rx="6" stroke="#00e5ff" stroke-width="2"/>
                <circle cx="32" cy="32" r="10" stroke="#00e5ff" stroke-width="2"/>
                <circle cx="32" cy="32" r="4" fill="#00e5ff" opacity="0.5"/>
                <rect x="24" y="8" width="16" height="6" rx="3" fill="#00e5ff" opacity="0.4"/>
              </svg>

              <button class="btn-start" onclick="init()">
                <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M2 6a2 2 0 012-2h.5l1.5-2h8l1.5 2H18a2 2 0 012 2v9a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
                  <circle cx="10" cy="11" r="3" fill="rgba(0,0,0,0.4)"/>
                </svg>
                Ativar Câmera
              </button>

              <p class="cam-hint">
                Clique para solicitar permissão à câmera.<br>
                <strong>Nenhuma imagem é enviada</strong> — tudo roda localmente.
              </p>
            </div>

            <!-- Webcam canvas injected here -->
            <div id="webcam-container" class="d-none"></div>
          </div>
        </div>

        <!-- Right: predictions -->
        <div class="col-12 col-md-6">
          <div class="results-section h-100">
            <div class="results-title">// Classificação em tempo real</div>

            <!-- Empty state (before init) -->
            <div class="empty-state" id="empty-state">
              <svg class="empty-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="20" width="48" height="30" rx="4" stroke="#e8eaf0" stroke-width="2"/>
                <path d="M20 20V16a4 4 0 014-4h16a4 4 0 014 4v4" stroke="#e8eaf0" stroke-width="2"/>
                <circle cx="32" cy="35" r="8" stroke="#e8eaf0" stroke-width="2"/>
              </svg>
              <p class="empty-text">Ative a câmera para ver<br>as predições em tempo real.</p>
            </div>

            <!-- Labels injected here -->
            <div id="label-container"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      Powered by <a href="https://teachablemachine.withgoogle.com/" target="_blank">Teachable Machine</a>
      &nbsp;·&nbsp;
      <a href="https://www.tensorflow.org/js" target="_blank">TensorFlow.js</a>
    </div>
  </footer>

</div>

<!-- TensorFlow & Teachable Machine -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
  const URL = "https://teachablemachine.withgoogle.com/models/Pd2guDtye/";
  let model, webcam, labelContainer, maxPredictions;
  let predictionItems = [];

  // Color palette for different classes
  const COLORS = [
    ['#7c3aed', '#00e5ff'],
    ['#f59e0b', '#ef4444'],
    ['#10b981', '#06b6d4'],
    ['#f43f5e', '#a855f7'],
    ['#3b82f6', '#8b5cf6'],
  ];

  async function init() {
    const modelURL  = URL + "model.json";
    const metaURL   = URL + "metadata.json";

    // Update UI state
    document.getElementById('start-screen').classList.add('d-none');
    document.getElementById('status-dot').classList.add('active');
    document.getElementById('status-label').textContent = 'Carregando modelo…';
    document.getElementById('webcam-section').classList.add('scanning');

    model = await tmImage.load(modelURL, metaURL);
    maxPredictions = model.getTotalClasses();

    const flip = true;
    webcam = new tmImage.Webcam(260, 260, flip);
    await webcam.setup();
    await webcam.play();
    window.requestAnimationFrame(loop);

    // Show webcam
    const wc = document.getElementById('webcam-container');
    wc.classList.remove('d-none');
    wc.appendChild(webcam.canvas);

    // Hide empty state
    document.getElementById('empty-state').classList.add('d-none');

    // Build prediction items
    labelContainer = document.getElementById('label-container');
    predictionItems = [];

    for (let i = 0; i < maxPredictions; i++) {
      const colors = COLORS[i % COLORS.length];

      const item = document.createElement('div');
      item.className = 'prediction-item';

      const header = document.createElement('div');
      header.className = 'prediction-header';

      const classEl = document.createElement('span');
      classEl.className = 'prediction-class';
      classEl.textContent = '—';

      const pctEl = document.createElement('span');
      pctEl.className = 'prediction-pct';
      pctEl.textContent = '0%';

      header.appendChild(classEl);
      header.appendChild(pctEl);

      const track = document.createElement('div');
      track.className = 'progress-track';

      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      fill.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]})`;
      track.appendChild(fill);

      item.appendChild(header);
      item.appendChild(track);
      labelContainer.appendChild(item);

      predictionItems.push({ classEl, pctEl, fill });
    }

    document.getElementById('status-label').textContent = 'Ao vivo';
  }

  async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
  }

  async function predict() {
    const prediction = await model.predict(webcam.canvas);

    // Find the highest confidence index
    let maxIdx = 0;
    prediction.forEach((p, i) => {
      if (p.probability > prediction[maxIdx].probability) maxIdx = i;
    });

    for (let i = 0; i < maxPredictions; i++) {
      const prob = prediction[i].probability;
      const pct  = Math.round(prob * 100);
      const { classEl, pctEl, fill } = predictionItems[i];

      classEl.textContent = prediction[i].className;
      pctEl.textContent   = pct + '%';
      fill.style.width    = pct + '%';

      // Highlight the winning class
      if (i === maxIdx && pct > 40) {
        fill.classList.add('high');
        pctEl.style.color = 'var(--success)';
      } else {
        fill.classList.remove('high');
        pctEl.style.color = 'var(--accent)';
      }
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
